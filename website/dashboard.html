<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="color-scheme" content="light dark">
        <link href = "./assets/main.css" rel = "stylesheet">
        <link href = "./assets/mobile.css" rel = "stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="./assets/images/icons/favicon.ico">
        <script type = "text/javascript" src = "./assets/scripts/ui.js" defer></script>
        <title>QuietIoT - Dashboard</title>
    </head>
    <body>
        <header>
            <ul class = "navBar">
                <li><img src = "./assets/images/logo.png" alt = "Logo"><h1>QuietIoT</h1></li>
                <li><a href = "index.html">Home</a></li>
                <li><a class = "active" href = "dashboard.html">Dashboard</a></li>
                <li><a href = "settings.html">Settings</a></li>
                <li class = "right"><a href = "login.html">Loading...</a></li>
            </ul>
        </header>
        <main>
            <div class = "loading-screen"><p>Loading...</p><img src = "./assets/images/icons/loading_icon.png" class = loading-icon></div>
            <div class = "content">
                <div class = "heading">
                    <h2>Dashboard</h2>
                </div>
                <div class = dashboard-content>
                    <div class = "dashboard-card">
                        <h3>Devices</h3>
                        <ul class = "device-list" id = "device-list">
                            <li class = "device-element">Your devices will show up here</li>
                            <li>Follow the instructions on the <a href = "./index.html">home</a> page to set up a device for use.</li>
                        </ul>
                    </div>
                    <div class = "dashboard-card">
                        <h3>Live readings</h3>
                        <ul class = "readings-list" id = "readings-list">
                        </ul>
                    </div>
                    <!--<div class = "dashboard-card">
                        <h3>Raw Data</h3>
                        <pre><code id = dumpField>
                        </code></pre>
                    </div>-->
                    <div class = "dashboard-card">
                        <h3>Hour Average</h3>
                        <canvas id = "noiseChart"></canvas>
                    </div>
                    <div class = "dashboard-card dashboard-chart-card dashboard-wide-card">
                        <h3>Hourly averages</h3>
                        <div class = "chart-control">
                            <label for = "line-chart-range">Period</label>
                            <select id = "line-chart-range">
                                <option value = "168">Last 7 days</option>
                                <option value = "72">Last 3 days</option>
                                <option value = "24">Last 24 hours</option>
                                <option value = "12" selected>Last 12 hours</option>
                                <option value = "last-hour">Last hour</option>
                            </select>
                        </div>
                        <div class = "chart-frame">
                            <canvas id = "line-chart"></canvas>
                        </div>
                    </div>
                    <div class = "dashboard-card dashboard-chart-card">
                        <h3>Readings above threshold</h3>
                        <div class = "chart-control">
                            <label for = "threshold-slider">Threshold: <span id = "threshold-value">70</span>dBA</label>
                            <input type = "range" id = "threshold-slider" min = "40" max = "100" value = "70">
                            <label for = "threshold-window">Period</label>
                            <select id = "threshold-window">
                                <option value = "3600">Last hour</option>
                                <option value = "43200">Last 12 hours</option>
                                <option value = "86400" selected>Last 24 hours</option>
                            </select>
                        </div>
                        <div class = "chart-frame">
                            <canvas id = "threshold-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <p>This site is on <a href = "https://github.com/gonkEnjoyer/quietiot" target = "_blank">GitHub</a></p>
        </footer>
        <script type="module" src="./assets/scripts/firebase_auth.js" defer></script>
        <script type="module" src = "./assets/scripts/firebase_rtdb.js"></script>
        <script type="module" src = "./assets/scripts/dashboard.js"></script>
        <script type = "text/javascript" src = "./assets/scripts/loading.js" defer></script>
    </body>
</html>
